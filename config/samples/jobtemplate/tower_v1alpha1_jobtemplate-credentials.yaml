apiVersion: tower.ansible.com/v1alpha1
kind: JobTemplate
metadata:
  name: jobtemplate-with-credentials
spec:
  connection_secret: awxaccess
  name: Deploy Application
  project: Demo Project
  playbook: deploy.yml
  inventory: Demo Inventory
  # AWX Credential names, IDs, or named URLs. They must already exist in AWX.
  credentials:
    - Demo SSH Credential
    - Demo Cloud Credential
  # AWX Vault Credential names, IDs, or named URLs. They must already exist in AWX.
  vault_credentials:
    - Demo Vault Credential
  extra_vars:
    environment: uat
