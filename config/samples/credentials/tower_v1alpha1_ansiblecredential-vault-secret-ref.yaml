apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleCredential
metadata:
  name: vault-credential
  namespace: awx
spec:
  name: vault-credential
  organization: Default
  connection_secret: awxaccess
  type: HashiCorp Vault Secret Lookup
  # Non-sensitive values remain in the CR.
  credential_inputs:
    url: https://vault.example.com
    namespace: platform
  # Sensitive values are read by the runner from this Kubernetes Secret.
  # The Secret value is never copied into this CR or its status.
  credential_inputs_from:
    role_id:
      name: vault-credential-secret
      key: role-id
    secret_id:
      name: vault-credential-secret
      key: secret-id
