---
- name: Apply NetworkPolicies
  include_role:
    name: networkpolicy

- name: Read AnsibleUser info
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleUser
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: resource_info

- name: Set resource generation
  set_fact:
    _resource_generation: "{{ resource_info.resources[0].metadata.generation | default(1) }}"

- name: Check existing runner job
  kubernetes.core.k8s_info:
    kind: Job
    api_version: batch/v1
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: k8s_job

- name: End play when the current generation has already finished
  meta: end_play
  when:
    - state | default('present') != 'absent'
    - resource_info.resources[0].status.isFinished | default(false) | bool
    - resource_info.resources[0].status.observedGeneration | default(-1) | int == resource_info.resources[0].metadata.generation | int
    - (not (resource_info.resources[0].status.error | default(false) | bool) or
       resource_info.resources[0].status.retryCount | default(0) | int >= max_retries | int)

- name: Remove stale runner job before processing a changed, deleted, or SSO-waiting resource
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  when:
    - k8s_job.resources | length > 0
    - (state | default('present') == 'absent') or
      ((resource_info.resources[0].status.observedGeneration | default(-1) | int != resource_info.resources[0].metadata.generation | int and
        (k8s_job.resources[0].status.succeeded | default(0) | int > 0 or
         k8s_job.resources[0].status.failed | default(0) | int > 0)) or
       (resource_info.resources[0].status.error | default(false) | bool and
        resource_info.resources[0].status.retryCount | default(0) | int < max_retries | int and
        k8s_job.resources[0].status.failed | default(0) | int > 0) or
       (resource_info.resources[0].status.waitingForSSO | default(false) | bool and
        (k8s_job.resources[0].status.succeeded | default(0) | int > 0 or
         k8s_job.resources[0].status.failed | default(0) | int > 0)))

# The waiting runner exits successfully after recording waitingForSSO. On the
# next periodic reconcile the old Job must be removed before the same name can
# be used for a new runner Job (Job pod-template fields are immutable).
- name: Wait for the SSO-waiting runner Job to be removed
  kubernetes.core.k8s_info:
    kind: Job
    api_version: batch/v1
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: previous_runner_job
  until: previous_runner_job.resources | length == 0
  retries: 30
  delay: 1
  when:
    - resource_info.resources[0].status.waitingForSSO | default(false) | bool
    - k8s_job.resources | length > 0
    - (k8s_job.resources[0].status.succeeded | default(0) | int > 0 or
       k8s_job.resources[0].status.failed | default(0) | int > 0)

- name: End play when a runner job is already active
  meta: end_play
  when:
    - k8s_job.resources | length > 0
    - state | default('present') != 'absent'
    - not (k8s_job.resources[0].status.succeeded | default(0) | int > 0)
    - not (k8s_job.resources[0].status.failed | default(0) | int > 0)

- name: Set runner image
  set_fact:
    _runner_image: "{{ (runner_image + ':' + runner_version) if runner_image is defined and runner_version is defined else lookup('env', 'RELATED_IMAGE_ANSIBLE_JOB_RUNNER_IMAGE') }}"
    _runner_pull_policy: "{{ runner_pull_policy | default('IfNotPresent') }}"

- name: Create runner service account and job
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) }}"
  loop:
    - service_account.yml.j2
    - job_definition.yml.j2

# Deleting the AnsibleUser resource only revokes the AWX user types and keeps
# the AWX user as a normal user; the runner never deletes the user record.
- name: Wait for AWX user type revocation runner to finish
  kubernetes.core.k8s_info:
    kind: Job
    api_version: batch/v1
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: deletion_job
  until: >-
    deletion_job.resources | length > 0 and
    (deletion_job.resources[0].status.succeeded | default(0) | int == 1 or
     deletion_job.resources[0].status.failed | default(0) | int >= backoff_limit | int + 1)
  retries: 60
  delay: 2
  when: state | default('present') == 'absent'

- name: Fail finalization when the AWX user type revocation runner failed
  ansible.builtin.fail:
    msg: "AWX user type revocation runner job failed. Inspect job/{{ ansible_operator_meta.name }} logs."
  when:
    - state | default('present') == 'absent'
    - deletion_job.resources[0].status.failed | default(0) | int >= backoff_limit | int + 1

- name: Update AnsibleUser status with runner job info
  operator_sdk.util.k8s_status:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleUser
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    status:
      k8sJob:
        created: true
        namespacedName: "{{ ansible_operator_meta.namespace + '/' + ansible_operator_meta.name }}"
        message: "AWX user operation submitted to the job runner"
