---
- name: Apply NetworkPolicies
  include_role:
    name: networkpolicy

- name: Read K8s runner job info
  kubernetes.core.k8s_info:
    kind: Job
    api_version: batch/v1
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: k8s_job

- name: Read AnsibleCredentials info
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleCredential
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: ansiblecred_info

- name: Read referenced Kubernetes Secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item.value.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  loop: "{{ credential_inputs_from | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }} <- {{ item.value.name }}"
  register: credential_input_secrets
  when:
    - state | default('present') != 'absent'
    - credential_inputs_from | default({}) | length > 0

- name: Fail when a referenced Secret is missing
  ansible.builtin.fail:
    msg: "Referenced Kubernetes Secret '{{ item.item.value.name }}' for credential input '{{ item.item.key }}' was not found in namespace '{{ ansible_operator_meta.namespace }}'."
  loop: "{{ credential_input_secrets.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('unknown') }}"
  when:
    - state | default('present') != 'absent'
    - item.resources | default([]) | length == 0

- name: Record referenced Secret versions
  ansible.builtin.set_fact:
    _credential_secret_versions: "{{ (_credential_secret_versions | default([])) + [item.resources[0].metadata.resourceVersion] }}"
  loop: "{{ credential_input_secrets.results | default([]) }}"
  when:
    - state | default('present') != 'absent'
    - item.resources | default([]) | length > 0

- name: Calculate referenced Secret change state
  ansible.builtin.set_fact:
    _credential_secret_version: "{{ (_credential_secret_versions | default([]) | sort) | join(',') }}"
    _credential_secret_changed: >-
      {{ (_credential_secret_versions | default([]) | sort) | join(',') !=
         ((ansiblecred_info.resources[0].status | default({})).observedSecretVersion | default('')) }}
  when: state | default('present') != 'absent'

- name: End play early if AnsibleCredential has already finished
  meta: end_play
  when:
    - state | default('present') != 'absent'
    - ansiblecred_info['resources'][0]['status']['isFinished'] is defined
    - ansiblecred_info['resources'][0]['status']['isFinished']
    - not (_credential_secret_changed | default(false) | bool)

- block:
    - name: Check number of attempts to execute the job have been made
      set_fact:
        _attempts: "{{ k8s_job['resources'][0]['status']['failed'] | default(0) }}"

    - name: Set the maximum failed attempts allowed based on the backoffLimit
      set_fact:
        _failures_allowed: "{{ backoff_limit }} + 1"

    - name: Update AnsibleCredential status if backoff limit is exceeded
      operator_sdk.util.k8s_status:
        api_version: tower.ansible.com/v1alpha1
        kind: AnsibleCredential
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          isFinished: true
          message: "This job instance reached its backoff limit. Inspect playbook output for more info."
      when:
        - _attempts >= _failures_allowed

    - name: Update AnsibleCredential status with message
      operator_sdk.util.k8s_status:
        api_version: tower.ansible.com/v1alpha1
        kind: AnsibleCredential
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        status:
          message: "This job instance is already running or has reached its end state."
    - name: End play early
      meta: end_play
  when:
    - state | default('present') != 'absent'
    - k8s_job['resources'] is defined
    - (k8s_job["resources"]|length>0)
    - not (_credential_secret_changed | default(false) | bool)

- name: Set user provided runner image
  set_fact:
    _custom_runner_image: "{{ runner_image }}:{{ runner_version }}"
  when:
    - runner_image is defined
    - runner_version is defined

- name: Set Runner image URL
  set_fact:
    _runner_image: "{{ _custom_runner_image | default(lookup('env', 'RELATED_IMAGE_ANSIBLE_JOB_RUNNER_IMAGE')) }}"

- name: Set Runner Pull Policy
  set_fact:
    _runner_pull_policy: "{{ runner_pull_policy | default('IfNotPresent') }}"

- name: Create ServiceAccount to run subsequent jobs
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'service_account.yml.j2') }}"

- name: Remove runner job before deleting the AWX credential or refreshing Secret inputs
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    wait: true
  when:
    - state | default('present') == 'absent' or (_credential_secret_changed | default(false) | bool)

- name: Wait for the previous runner job to be removed before recreating it
  kubernetes.core.k8s_info:
    kind: Job
    api_version: batch/v1
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: previous_runner_job
  until: previous_runner_job.resources | length == 0
  retries: 30
  delay: 1
  when:
    - state | default('present') != 'absent'
    - _credential_secret_changed | default(false) | bool

- name: Start K8s Runner Job
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'job_definition.yml.j2') }}"

- name: Wait for AWX credential deletion to finish
  kubernetes.core.k8s_info:
    kind: Job
    api_version: batch/v1
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: deletion_job
  until: >-
    deletion_job.resources | length > 0 and
    (
      deletion_job.resources[0].status.succeeded | default(0) | int == 1 or
      deletion_job.resources[0].status.failed | default(0) | int >= backoff_limit | int + 1
    )
  retries: 60
  delay: 2
  when: state | default('present') == 'absent'

- name: Fail finalization when AWX credential deletion failed
  ansible.builtin.fail:
    msg: "AWX credential deletion runner job failed. Inspect job/{{ ansible_operator_meta.name }} logs."
  when:
    - state | default('present') == 'absent'
    - deletion_job.resources[0].status.failed | default(0) | int >= backoff_limit | int + 1

- name: Set credential name
  set_fact:
    _credential_name: "{{ name}}"

- name: Update AnsibleCredential status with K8s job info
  operator_sdk.util.k8s_status:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleCredential
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    status:
      observedSecretVersion: "{{ _credential_secret_version | default('') }}"
      k8sJob:
        created: true
        message: |-
          Monitor the job.batch status for more details with the following commands:
          'kubectl -n {{ ansible_operator_meta.namespace }} get job.batch/{{ ansible_operator_meta.name }}'
          'kubectl -n {{ ansible_operator_meta.namespace }} describe job.batch/{{ ansible_operator_meta.name }}'
          'kubectl -n {{ ansible_operator_meta.namespace }} logs -f job.batch/{{ ansible_operator_meta.name }}'
        namespacedName: "{{ ansible_operator_meta.namespace+'/'+ansible_operator_meta.name }}"
        env:
          inventory: "{{ inventory | default(omit) }}"
          secretNamespacedName: "{{ ansible_operator_meta.namespace+'/'+(connection_secret | default(tower_auth_secret, true)) }}"
          credentialName: "{{ _credential_name }}"
          verifySSL: false
