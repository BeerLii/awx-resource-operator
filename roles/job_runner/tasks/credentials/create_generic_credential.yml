- name: Define credentials, if error update AnsibleCredential status then end play
  block:
    - name: Parse credential inputs
      ansible.builtin.set_fact:
        _credential_inputs: "{{ lookup('env', 'CREDENTIAL_INPUTS') | default('{}', true) | from_json }}"
      no_log: true

    - name: Validate credential inputs
      ansible.builtin.assert:
        that:
          - _credential_inputs is mapping
        fail_msg: CREDENTIAL_INPUTS must be a JSON object.

    - name: Create Credential
      awx.awx.credential:
        name: "{{ lookup('env', 'NAME') }}"
        description: "{{ lookup('env', 'DESCRIPTION') }}"
        organization: "{{ lookup('env', 'ORGANIZATION') }}"
        credential_type: "{{ lookup('env', 'TYPE') }}"
        # awx.awx.credential accepts a dictionary; a valid JSON object is also
        # accepted by Ansible's argument conversion and avoids stringified
        # Python dictionaries such as {'key': 'value'}.
        inputs: "{{ _credential_inputs | to_json }}"
        state: "{{ lookup('env', 'STATE') | default('present', true) }}"
      register: credentials

  rescue:
    - name: Update status if creation resulted in an error
      operator_sdk.util.k8s_status:
        api_version: tower.ansible.com/v1alpha1
        kind: AnsibleCredential
        name: "{{ lookup('env', 'ANSIBLECREDENTIAL_NAME') }}"
        namespace: "{{ lookup('env', 'ANSIBLECREDENTIAL_NAMESPACE') }}"
        status:
          isFinished: true
          AnsibleCredentialsResult:
            status: "error"
    - name: End playbook run
      meta: end_play

- name: Update AnsibleCredential status
  operator_sdk.util.k8s_status:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleCredential
    name: "{{ lookup('env', 'ANSIBLECREDENTIAL_NAME') }}"
    namespace: "{{ lookup('env', 'ANSIBLECREDENTIAL_NAMESPACE') }}"
    status:
      isFinished: true
      AnsibleCredentialsResult:
        changed: "{{ credentials.changed }}"
        failed: "{{ credentials.failed }}"
