---
- name: Parse credential type definition
  ansible.builtin.set_fact:
    _credential_type_inputs: "{{ lookup('env', 'INPUTS') | default('{}', true) | from_json }}"
    _credential_type_injectors: "{{ lookup('env', 'INJECTORS') | default('{}', true) | from_json }}"

- name: Manage AWX credential type
  block:
    - name: Create or update AWX credential type
      awx.awx.credential_type:
        name: "{{ lookup('env', 'NAME') }}"
        description: "{{ lookup('env', 'DESCRIPTION') | default('', true) }}"
        kind: "{{ lookup('env', 'KIND') }}"
        inputs: "{{ _credential_type_inputs | to_json }}"
        injectors: "{{ _credential_type_injectors | to_json }}"
        state: "{{ lookup('env', 'STATE') | default('present', true) }}"
      register: resource_result
  rescue:
    - operator_sdk.util.k8s_status:
        api_version: tower.ansible.com/v1alpha1
        kind: AnsibleCredentialType
        name: "{{ lookup('env', 'RUNNER_RESOURCE_NAME') }}"
        namespace: "{{ lookup('env', 'RUNNER_RESOURCE_NAMESPACE') }}"
        status:
          isFinished: true
          error: true
          message: "AWX credential type operation failed: {{ ansible_failed_result.msg | default('unknown error') }}"
    - meta: end_play

- name: Update credential type status
  operator_sdk.util.k8s_status:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleCredentialType
    name: "{{ lookup('env', 'RUNNER_RESOURCE_NAME') }}"
    namespace: "{{ lookup('env', 'RUNNER_RESOURCE_NAMESPACE') }}"
    status:
      isFinished: true
      error: false
      observedGeneration: "{{ lookup('env', 'RUNNER_RESOURCE_GENERATION') | default('0', true) | int }}"
      message: AWX credential type managed by the job runner
      credentialTypeResult:
        changed: "{{ resource_result.changed | default(false) }}"
