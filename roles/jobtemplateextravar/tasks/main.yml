---
- name: Read JobTemplateExtraVars
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: JobTemplateExtraVars
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: extra_vars_resource

- name: Find JobTemplates that reference this JobTemplateExtraVars
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: JobTemplate
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: referencing_jobtemplates

- name: Notify referencing JobTemplates that extra variables changed
  kubernetes.core.k8s:
    state: patched
    api_version: tower.ansible.com/v1alpha1
    kind: JobTemplate
    name: "{{ item.metadata.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    definition:
      metadata:
        annotations:
          tower.ansible.com/jobtemplate-extravars-generation: "{{ extra_vars_resource.resources[0].metadata.generation | default(0) }}"
  loop: "{{ referencing_jobtemplates.resources }}"
  when:
    - item.spec.extra_vars_ref is defined
    - item.spec.extra_vars_ref.name == ansible_operator_meta.name
    - extra_vars_resource.resources | length > 0

- name: Mark JobTemplateExtraVars as managed
  operator_sdk.util.k8s_status:
    api_version: tower.ansible.com/v1alpha1
    kind: JobTemplateExtraVars
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    status:
      message: "JobTemplate extra variables are available for JobTemplate references"
      observedGeneration: "{{ lookup('env', 'RUNNER_RESOURCE_GENERATION') | default('0', true) | int }}"
