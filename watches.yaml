---
# Use the 'create api' subcommand to add watches to this file.
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleJob
  role: job
  watchDependentResources: True
  # finalizer:
  #   name: finalizer.tower.ansible.com
  #   vars:
  #     tower_resource_state: absent

- version: v1alpha1
  group: tower.ansible.com
  kind: JobTemplateExtraVars
  role: jobtemplateextravar
  watchDependentResources: True

- version: v1alpha1
  group: tower.ansible.com
  kind: JobTemplate
  role: jobtemplate
  finalizer:
    name: finalizer.tower.ansible.com
    vars:
      state: absent
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleProject
  role: project
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleWorkflow
  role: workflow
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleCredentialType
  role: credentialtype
  finalizer:
    name: finalizer.tower.ansible.com
    vars:
      state: absent
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleCredential
  role: credential
  finalizer:
    name: finalizer.tower.ansible.com
    vars:
      state: absent
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleSchedule
  role: schedule
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleInstanceGroup
  role: instancegroup
- version: v1alpha1
  group: tower.ansible.com
  kind: WorkflowTemplate
  role: workflowtemplate
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleHost
  role: host
  finalizer:
    name: finalizer.tower.ansible.com
    vars:
      state: absent
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleGroup
  role: group
  finalizer:
    name: finalizer.tower.ansible.com
    vars:
      state: absent
- version: v1alpha1
  group: tower.ansible.com
  kind: AnsibleInventory
  role: inventory
  finalizer:
    name: finalizer.tower.ansible.com
    vars:
      state: absent
#+kubebuilder:scaffold:watch
